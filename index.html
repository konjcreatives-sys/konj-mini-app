<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت استودیو کنج (v4.5)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    h2, h3 { margin-top: 0; color: #fff; }
    label { display: block; margin-top: 12px; font-size: 0.9em; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    .date-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .date-row select {
      flex: 1;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8em;
      background: #334155;
    }
    .status-ok { color: var(--success); }
    .status-err { color: var(--danger); }
    .hidden { display: none; }
    .task-item {
      border-right: 3px solid var(--accent);
      padding-right: 10px;
      margin-bottom: 10px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #334155;
      color: #94a3b8;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .jalali-badge {
      font-size: 0.85em;
      color: #38bdf8;
      margin-top: 6px;
      display: block;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="unauthorized-view" class="hidden card" style="text-align: center; color: var(--danger);">
    <h2>⚠️ عدم دسترسی</h2>
    <p>لطفاً این برنامه را مستقیماً از داخل ربات تلگرام استودیو کنج باز کنید.</p>
  </div>

  <div id="member-view" class="hidden">
    <div class="card">
      <h2>📌 کارتابل شخصی شما</h2>
      <p id="member-greeting" style="color: var(--muted);"></p>
      <div id="member-tasks-list">در حال دریافت آفیش‌ها...</div>
    </div>
  </div>

  <div id="admin-view" class="hidden">
    <div class="card">
      <h2>👑 پنل مدیریت استودیو کنج <small style="font-size:0.5em; color:var(--success)">(v4.5)</small></h2>
      <div id="status-bar" class="badge">در حال بررسی اتصال...</div>
    </div>

    <div class="tabs">
      <button id="tab-single-btn" class="tab-btn active" onclick="switchTab('single')">📌 پروژه / آفیش تکی</button>
      <button id="tab-monthly-btn" class="tab-btn" onclick="switchTab('monthly')">📅 برنامه‌ریزی ماهانه</button>
    </div>

    <!-- فرم ۱: ثبت پروژه تکی -->
    <div id="single-project-card" class="card">
      <h3>📌 ثبت پروژه / آفیش تکی</h3>

      <label>نام برند / کارفرما:</label>
      <input type="text" id="single_brand" placeholder="مثال: برند نایک">

      <label>عنوان / موضوع آفیش:</label>
      <input type="text" id="single_title" placeholder="مثال: تصویربرداری تیزر تبلیغاتی">

      <label>تخصص مورد نیاز:</label>
      <select id="single_role">
        <option value="filmmaker">🎥 تصویربردار / فیلم‌ساز</option>
        <option value="photographer">📷 عکاس</option>
        <option value="editor">🎬 تدوین‌گر</option>
        <option value="designer">🎨 طراح گرافیک</option>
        <option value="ai_artist">🤖 هنرمند AI</option>
      </select>

      <label>📅 انتخاب تاریخ شمسی آفیش:</label>
      <div class="date-row">
        <select id="single_shamsi_day"></select>
        <select id="single_shamsi_month"></select>
        <select id="single_shamsi_year"></select>
      </div>
      <span id="single_date_summary" class="jalali-badge"></span>

      <label>ساعت شروع:</label>
      <input type="time" id="single_time" value="14:00">

      <label>محل / لوکیشن:</label>
      <input type="text" id="single_location" placeholder="مثال: استودیو کنج / جزیره کیش">

      <label>انتخاب مجری تسک:</label>
      <select id="single_assignee">
        <option value="">🔍 تخصیص بعداً توسط مدیر در ربات</option>
      </select>

      <label>دستمزد آفیش (تومان):</label>
      <input type="number" id="single_fee" value="1500000" step="100000">

      <button id="single-submit-btn" onclick="submitSingleProject()" style="background: var(--success);">🚀 ثبت نهایی پروژه تکی</button>
    </div>

    <!-- فرم ۲: برنامه‌ریزی ماهانه اینستاگرام -->
    <div id="monthly-project-card" class="card hidden">
      <h3>📅 برنامه‌ریزی ماهانه اینستاگرام</h3>
      
      <label>نام برند / کارفرما:</label>
      <input type="text" id="brand_name" placeholder="مثال: برند نایک">

      <label>📅 انتخاب تاریخ شمسی شروع قرارداد:</label>
      <div class="date-row">
        <select id="monthly_shamsi_day"></select>
        <select id="monthly_shamsi_month"></select>
        <select id="monthly_shamsi_year"></select>
      </div>
      <span id="monthly_date_summary" class="jalali-badge"></span>

      <label>تعداد پست در ماه:</label>
      <input type="number" id="posts_count" value="4" min="1" max="30">

      <label>تعداد آفیش تصویربرداری:</label>
      <input type="number" id="video_shoots" value="2" min="0">

      <label>تعداد آفیش عکاسی:</label>
      <input type="number" id="photo_shoots" value="1" min="0">

      <button onclick="generateSchedule()">⚡️ تولید پیش‌نویس برنامه</button>

      <div id="preview-section" class="hidden" style="margin-top: 16px;">
        <h3>🔍 پیش‌نمایش جدول زمان‌بندی (تاریخ‌های شمسی)</h3>
        <div id="generated-tasks"></div>
        <button id="submit-btn" onclick="submitProject()" style="background: var(--success);">🚀 ثبت نهایی و ارسال به ربات</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const SUPABASE_URL = "https://hloqlpffqvxqaqixmikc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhsb3FscGZmcXZ4cWFxaXhtaWtjIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDEzOTU0OCwiZXhwIjoyMDk5NzE1NTQ4fQ.XQlPjyGfzye0e-FmelZ2GnrTcC_CDMNsK8bAoa1hSDE";
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/super-processor`;

    const ADMIN_ID = 83013720;
    const currentUser = tg.initDataUnsafe?.user || null;
    let activeMembers = [];
    let calculatedTasks = [];

    const SHAMSI_MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];

    function populateShamsiDropdowns(prefix) {
      const daySel = document.getElementById(`${prefix}_shamsi_day`);
      const monthSel = document.getElementById(`${prefix}_shamsi_month`);
      const yearSel = document.getElementById(`${prefix}_shamsi_year`);

      if (!daySel || !monthSel || !yearSel) return;

      daySel.innerHTML = "";
      for (let d = 1; d <= 31; d++) {
        const val = String(d).padStart(2, '0');
        daySel.innerHTML += `<option value="${d}">${val}</option>`;
      }

      monthSel.innerHTML = "";
      SHAMSI_MONTHS.forEach((mName, idx) => {
        monthSel.innerHTML += `<option value="${idx + 1}">${mName}</option>`;
      });

      yearSel.innerHTML = "";
      [1403, 1404, 1405, 1406, 1407].forEach(y => {
        yearSel.innerHTML += `<option value="${y}">${y}</option>`;
      });

      daySel.value = 1;
      monthSel.value = 5; // مرداد
      yearSel.value = 1405;

      const updateSummary = () => {
        const summaryEl = document.getElementById(`${prefix}_date_summary`);
        if (summaryEl) {
          summaryEl.innerText = `📌 تاریخ انتخابی: ${daySel.value} ${SHAMSI_MONTHS[monthSel.value - 1]} ${yearSel.value}`;
        }
      };

      daySel.onchange = updateSummary;
      monthSel.onchange = updateSummary;
      yearSel.onchange = updateSummary;
      updateSummary();
    }

    function jalaliToGregorian(jy, jm, jd) {
      jy = Number(jy);
      jm = Number(jm);
      jd = Number(jd);
      let gy = (jy > 979) ? 1600 : 621;
      jy -= (jy > 979) ? 979 : 0;
      let days = (365 * jy) + Math.floor(jy / 33) * 8 + Math.floor(((jy % 33) + 3) / 4);
      const j_d_m = [0, 31, 62, 93, 124, 155, 186, 216, 247, 277, 308, 338];
      days += j_d_m[jm - 1] + jd - 1;
      gy += 400 * Math.floor(days / 146097);
      days %= 146097;
      if (days > 36524) {
        days--;
        gy += 100 * Math.floor(days / 36524);
        days %= 36524;
        if (days >= 365) days++;
      }
      gy += 4 * Math.floor(days / 1461);
      days %= 1461;
      if (days > 365) {
        gy += Math.floor((days - 1) / 365);
        days = (days - 1) % 365;
      }
      let gd = days + 1;
      const sal_a = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      let gm = 0;
      while (gm < 13 && gd > sal_a[gm]) {
        gd -= sal_a[gm];
        gm++;
      }
      return `${gy}-${String(gm).padStart(2, '0')}-${String(gd).padStart(2, '0')}`;
    }

    function gregorianToJalali(gy, gm, gd) {
      gy = Number(gy);
      gm = Number(gm);
      gd = Number(gd);
      if (!gy || !gm || !gd || isNaN(gy) || isNaN(gm) || isNaN(gd)) return "تاریخ نامشخص";
      const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
      let jy = (gy > 1600) ? 979 : 0;
      gy -= (gy > 1600) ? 1600 : 621;
      let gy2 = (gm > 2) ? (gy + 1) : gy;
      let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + g_d_m[gm - 1] + gd - 1;
      jy += 33 * Math.floor(days / 12053);
      days %= 12053;
      jy += 4 * Math.floor(days / 1461);
      days %= 1461;
      if (days > 365) {
        jy += Math.floor((days - 1) / 365);
        days = (days - 1) % 365;
      }
      let jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
      let jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
      return `${jd} ${SHAMSI_MONTHS[jm - 1]} ${jy}`;
    }

    function switchTab(tab) {
      if (tab === 'single') {
        document.getElementById("single-project-card").classList.remove("hidden");
        document.getElementById("monthly-project-card").classList.add("hidden");
        document.getElementById("tab-single-btn").classList.add("active");
        document.getElementById("tab-monthly-btn").classList.remove("active");
      } else {
        document.getElementById("monthly-project-card").classList.remove("hidden");
        document.getElementById("single-project-card").classList.add("hidden");
        document.getElementById("tab-monthly-btn").classList.add("active");
        document.getElementById("tab-single-btn").classList.remove("active");
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (!currentUser) {
        document.getElementById("unauthorized-view").classList.remove("hidden");
        return;
      }

      if (Number(currentUser.id) === ADMIN_ID) {
        document.getElementById("admin-view").classList.remove("hidden");
        populateShamsiDropdowns("single");
        populateShamsiDropdowns("monthly");
        await fetchMembers();
      } else {
        document.getElementById("member-view").classList.remove("hidden");
        document.getElementById("member-greeting").innerText = `سلام ${currentUser.first_name || ''} عزیز، خوش آمدید.`;
        await fetchMemberTasks();
      }
    });

    async function fetchMembers() {
      try {
        const res = await fetch(`${FUNCTION_URL}?action=get_members`, {
          headers: {
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'X-Telegram-Init-Data': tg.initData || ''
          }
        });
        
        const data = await res.json();
        activeMembers = data.members || [];
        
        const select = document.getElementById("single_assignee");
        select.innerHTML = '<option value="">🔍 تخصیص بعداً توسط مدیر در ربات</option>';
        activeMembers.forEach(m => {
          select.innerHTML += `<option value="${m.chat_id}">${m.name} (${m.chat_id})</option>`;
        });

        document.getElementById("status-bar").innerHTML = `<span class="status-ok">✅ سیستم آنلاین (${activeMembers.length} عضو فعال)</span>`;
      } catch (err) {
        document.getElementById("status-bar").innerHTML = `<span class="status-err">⚠️ عدم دریافت اعضا (حالت آفلاین)</span>`;
      }
    }

    async function fetchMemberTasks() {
      try {
        const res = await fetch(`${FUNCTION_URL}?action=get_user_tasks&chat_id=${currentUser.id}`, {
          headers: {
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'X-Telegram-Init-Data': tg.initData || ''
          }
        });
        const data = await res.json();
        const container = document.getElementById("member-tasks-list");
        if (!data.tasks || data.tasks.length === 0) {
          container.innerText = "هیچ آفیش یا تسک فعالی برای شما ثبت نشده است.";
          return;
        }
        container.innerHTML = data.tasks.map(t => {
          const parts = t.scheduled_date.split('-');
          const jDate = (parts.length === 3) ? gregorianToJalali(parts[0], parts, parts) : t.scheduled_date;
          return `
            <div class="task-item">
              <strong>${t.title}</strong><br>
              <small>📅 تاریخ: ${jDate} (${t.scheduled_date}) | ⏰ ساعت: ${t.scheduled_time || 'مشخص نشده'}</small><br>
              <small>وضعیت: ${t.status}</small>
            </div>
          `;
        }).join("");
      } catch (err) {
        document.getElementById("member-tasks-list").innerText = "خطا در دریافت لیست تسک‌ها.";
      }
    }

    async function submitSingleProject() {
      const brand = document.getElementById("single_brand").value.trim();
      const title = document.getElementById("single_title").value.trim();
      const sDay = document.getElementById("single_shamsi_day").value;
      const sMonth = document.getElementById("single_shamsi_month").value;
      const sYear = document.getElementById("single_shamsi_year").value;
      
      const gregDate = jalaliToGregorian(sYear, sMonth, sDay);

      const time = document.getElementById("single_time").value;
      const role = document.getElementById("single_role").value;
      const assignee = document.getElementById("single_assignee").value;
      const fee = parseInt(document.getElementById("single_fee").value, 10) || 0;
      const location = document.getElementById("single_location").value.trim();

      if (!brand) {
        alert("لطفاً نام برند را وارد کنید.");
        return;
      }

      const btn = document.getElementById("single-submit-btn");
      btn.disabled = true;
      btn.innerText = "در حال ثبت...";

      const payload = {
        action: "create_single_project",
        brand,
        title: title || `آفیش ${brand}`,
        date: gregDate,
        time,
        role,
        assignee: assignee || null,
        fee,
        location,
        admin_id: currentUser.id
      };

      await sendPayloadToBot(payload, btn, "🚀 ثبت نهایی پروژه تکی");
    }

    function generateSchedule() {
      const brand = document.getElementById("brand_name").value.trim();
      const sDay = document.getElementById("monthly_shamsi_day").value;
      const sMonth = document.getElementById("monthly_shamsi_month").value;
      const sYear = document.getElementById("monthly_shamsi_year").value;

      const startDateVal = jalaliToGregorian(sYear, sMonth, sDay);

      const postsCount = Math.max(1, parseInt(document.getElementById("posts_count").value, 10) || 1);
      const videoShoots = Math.max(0, parseInt(document.getElementById("video_shoots").value, 10) || 0);
      const photoShoots = Math.max(0, parseInt(document.getElementById("photo_shoots").value, 10) || 0);

      if (!brand) {
        alert("لطفا نام برند را وارد کنید.");
        return;
      }

      calculatedTasks = [];
      const parts = startDateVal.split('-');
      let baseDate = new Date(parseInt(parts[0], 10), parseInt(parts, 10) - 1, parseInt(parts, 10));

      function formatDateLocal(d) {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      for (let v = 0; v < videoShoots; v++) {
        let shootDate = new Date(baseDate);
        shootDate.setDate(shootDate.getDate() + (v * 7));
        calculatedTasks.push({
          type: "OFFISH_SHOOT",
          title: `🎥 آفیش تصویربرداری (${v + 1}) - ${brand}`,
          date: formatDateLocal(shootDate),
          fee: 1500000,
          role: "filmmaker",
          assignee: null
        });
      }

      for (let p = 0; p < photoShoots; p++) {
        let photoDate = new Date(baseDate);
        photoDate.setDate(photoDate.getDate() + (p * 7));
        calculatedTasks.push({
          type: "OFFISH_SHOOT",
          title: `📸 آفیش عکاسی (${p + 1}) - ${brand}`,
          date: formatDateLocal(photoDate),
          fee: 1200000,
          role: "photographer",
          assignee: null
        });
      }

      let postInterval = Math.max(4, Math.floor(28 / postsCount));

      for (let i = 1; i <= postsCount; i++) {
        let shootDate = new Date(baseDate);
        shootDate.setDate(shootDate.getDate() + ((i - 1) * postInterval));

        let editDate = new Date(shootDate);
        editDate.setDate(editDate.getDate() + 4);

        let pubDate = new Date(editDate);
        pubDate.setDate(pubDate.getDate() + 4);

        calculatedTasks.push({
          type: "EDIT_TASK",
          title: `🎬 تدوین و خروجی (پست ${i}) - ${brand}`,
          date: formatDateLocal(editDate),
          fee: 1000000,
          role: "editor",
          assignee: null
        });

        calculatedTasks.push({
          type: "PUBLISH_POST",
          title: `📅 انتشار پست ${i} - ${brand}`,
          date: formatDateLocal(pubDate),
          fee: 0,
          role: "admin",
          assignee: ADMIN_ID
        });
      }

      renderPreview();
    }

    function renderPreview() {
      const container = document.getElementById("generated-tasks");
      container.innerHTML = calculatedTasks.map((t, idx) => {
        const parts = t.date.split('-');
        const shamsiStr = (parts.length === 3) ? gregorianToJalali(parts[0], parts, parts) : t.date;
        return `
          <div class="task-item">
            <strong>${t.title}</strong><br>
            <small>📅 تاریخ شمسی: <strong>${shamsiStr}</strong></small><br>
            ${t.fee > 0 ? `
              <label>دستمزد (تومان):</label>
              <input type="number" value="${t.fee}" onchange="calculatedTasks[${idx}].fee = Math.max(0, parseInt(this.value, 10) || 0)">
            ` : ''}
          </div>
        `;
      }).join("");
      document.getElementById("preview-section").classList.remove("hidden");
    }

    async function submitProject() {
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.innerText = "در حال ارسال...";

      const payload = {
        action: "create_monthly_project",
        brand: document.getElementById("brand_name").value.trim(),
        admin_id: currentUser.id,
        tasks: calculatedTasks
      };

      await sendPayloadToBot(payload, btn, "🚀 ثبت نهایی و ارسال به ربات");
    }

    async function sendPayloadToBot(payload, btn, resetLabel) {
      try {
        const res = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'X-Telegram-Init-Data': tg.initData || ''
          },
          body: JSON.stringify({ message: { from: { id: currentUser.id }, web_app_data: { data: JSON.stringify(payload) } } })
        });

        if (res.ok) {
          tg.close();
        } else {
          tg.sendData(JSON.stringify(payload));
          tg.close();
        }
      } catch (e) {
        try {
          tg.sendData(JSON.stringify(payload));
          tg.close();
        } catch (err) {
          alert("خطا در ارسال داده‌ها به ربات. لطفاً مجدداً تلاش کنید.");
          btn.disabled = false;
          btn.innerText = resetLabel;
        }
      }
    }
  </script>
