<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت استودیو کنج</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    h2, h3 { margin-top: 0; color: #fff; }
    label { display: block; margin-top: 12px; font-size: 0.9em; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8em;
      background: #334155;
    }
    .status-ok { color: var(--success); }
    .status-err { color: var(--danger); }
    .hidden { display: none; }
    .task-item {
      border-right: 3px solid var(--accent);
      padding-right: 10px;
      margin-bottom: 10px;
    }
    .error-card {
      text-align: center;
      padding: 32px 16px;
      color: var(--danger);
    }
  </style>
</head>
<body>

  <div id="unauthorized-view" class="hidden card error-card">
    <h2>⚠️ عدم دسترسی</h2>
    <p>لطفاً این برنامه را مستقیماً از داخل ربات تلگرام استودیو کنج باز کنید.</p>
  </div>

  <div id="member-view" class="hidden">
    <div class="card">
      <h2>📌 کارتابل شخصی شما</h2>
      <p id="member-greeting" style="color: var(--muted);"></p>
      <div id="member-tasks-list">در حال دریافت آفیش‌ها...</div>
    </div>
  </div>

  <div id="admin-view" class="hidden">
    <div class="card">
      <h2>👑 پنل مدیریت استودیو کنج</h2>
      <div id="status-bar" class="badge">در حال بررسی اتصال...</div>
    </div>

    <div class="card">
      <h3>📅 برنامه‌ریزی ماهانه اینستاگرام</h3>
      
      <label>نام برند / کارفرما:</label>
      <input type="text" id="brand_name" placeholder="مثال: برند نایک">

      <label>تاریخ شروع قرارداد:</label>
      <input type="date" id="start_date">

      <label>تعداد پست در ماه:</label>
      <input type="number" id="posts_count" value="4" min="1" max="30">

      <label>تعداد آفیش تصویربرداری:</label>
      <input type="number" id="video_shoots" value="2" min="0">

      <label>تعداد آفیش عکاسی:</label>
      <input type="number" id="photo_shoots" value="1" min="0">

      <button onclick="generateSchedule()">⚡️ تولید پیش‌نویس برنامه</button>
    </div>

    <div id="preview-section" class="card hidden">
      <h3>🔍 پیش‌نمایش جدول زمان‌بندی (فاصله ۴ روزه)</h3>
      <div id="generated-tasks"></div>
      <button id="submit-btn" onclick="submitProject()" style="background: var(--success);">🚀 ثبت نهایی و ارسال به ربات</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // کلیدها و آدرس‌های تزریق‌شده استودیو کنج
    const SUPABASE_URL = "https://hloqlpffqvxqaqixmikc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhsb3FscGZmcXZ4cWFxaXhtaWtjIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDEzOTU0OCwiZXhwIjoyMDk5NzE1NTQ4fQ.XQlPjyGfzye0e-FmelZ2GnrTcC_CDMNsK8bAoa1hSDE";
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/super-processor`;

    const ADMIN_ID = 83013720;
    const currentUser = tg.initDataUnsafe?.user || null;
    let activeMembers = [];
    let calculatedTasks = [];

    function formatDateLocal(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (!currentUser) {
        document.getElementById("unauthorized-view").classList.remove("hidden");
        return;
      }

      if (Number(currentUser.id) === ADMIN_ID) {
        document.getElementById("admin-view").classList.remove("hidden");
        document.getElementById("start_date").value = formatDateLocal(new Date());
        await fetchMembers();
      } else {
        document.getElementById("member-view").classList.remove("hidden");
        document.getElementById("member-greeting").innerText = `سلام ${currentUser.first_name || ''} عزیز، خوش آمدید.`;
        await fetchMemberTasks();
      }
    });

    async function fetchMembers() {
      try {
        const res = await fetch(`${FUNCTION_URL}?action=get_members`, {
          headers: {
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'X-Telegram-Init-Data': tg.initData || ''
          }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        activeMembers = data.members || [];
        document.getElementById("status-bar").innerHTML = `<span class="status-ok">✅ سیستم آنلاین (${activeMembers.length} عضو فعال)</span>`;
      } catch (err) {
        document.getElementById("status-bar").innerHTML = `<span class="status-err">❌ خطا در دریافت اعضا</span>`;
      }
    }

    async function fetchMemberTasks() {
      try {
        const res = await fetch(`${FUNCTION_URL}?action=get_user_tasks&chat_id=${currentUser.id}`, {
          headers: {
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'X-Telegram-Init-Data': tg.initData || ''
          }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const container = document.getElementById("member-tasks-list");
        if (!data.tasks || data.tasks.length === 0) {
          container.innerText = "هیچ آفیش یا تسک فعالی برای شما ثبت نشده است.";
          return;
        }
        container.innerHTML = data.tasks.map(t => `
          <div class="task-item">
            <strong>${t.title}</strong><br>
            <small>📅 تاریخ: ${t.scheduled_date} | ⏰ ساعت: ${t.scheduled_time || 'مشخص نشده'}</small><br>
            <small>وضعیت: ${t.status}</small>
          </div>
        `).join("");
      } catch (err) {
        document.getElementById("member-tasks-list").innerText = "خطا در دریافت لیست تسک‌ها.";
      }
    }

    function generateSchedule() {
      const brand = document.getElementById("brand_name").value.trim();
      const startDateVal = document.getElementById("start_date").value;
      const postsCount = Math.max(1, parseInt(document.getElementById("posts_count").value, 10) || 1);
      const videoShoots = Math.max(0, parseInt(document.getElementById("video_shoots").value, 10) || 0);
      const photoShoots = Math.max(0, parseInt(document.getElementById("photo_shoots").value, 10) || 0);

      if (!brand || !startDateVal) {
        alert("لطفا نام برند و تاریخ شروع را وارد کنید.");
        return;
      }

      calculatedTasks = [];
      const parts = startDateVal.split('-');
      let baseDate = new Date(parseInt(parts[0], 10), parseInt(parts, 10) - 1, parseInt(parts, 10));

      for (let v = 0; v < videoShoots; v++) {
        let shootDate = new Date(baseDate);
        shootDate.setDate(shootDate.getDate() + (v * 7));
        calculatedTasks.push({
          type: "OFFISH_SHOOT",
          title: `🎥 آفیش تصویربرداری (${v + 1}) - ${brand}`,
          date: formatDateLocal(shootDate),
          fee: 1500000,
          role: "filmmaker",
          assignee: null
        });
      }

      for (let p = 0; p < photoShoots; p++) {
        let photoDate = new Date(baseDate);
        photoDate.setDate(photoDate.getDate() + (p * 7));
        calculatedTasks.push({
          type: "OFFISH_SHOOT",
          title: `📸 آفیش عکاسی (${p + 1}) - ${brand}`,
          date: formatDateLocal(photoDate),
          fee: 1200000,
          role: "photographer",
          assignee: null
        });
      }

      let postInterval = Math.max(4, Math.floor(28 / postsCount));

      for (let i = 1; i <= postsCount; i++) {
        let shootDate = new Date(baseDate);
        shootDate.setDate(shootDate.getDate() + ((i - 1) * postInterval));

        let editDate = new Date(shootDate);
        editDate.setDate(editDate.getDate() + 4);

        let pubDate = new Date(editDate);
        pubDate.setDate(pubDate.getDate() + 4);

        calculatedTasks.push({
          type: "EDIT_TASK",
          title: `🎬 تدوین و خروجی (پست ${i}) - ${brand}`,
          date: formatDateLocal(editDate),
          fee: 1000000,
          role: "editor",
          assignee: null
        });

        calculatedTasks.push({
          type: "PUBLISH_POST",
          title: `📅 انتشار پست ${i} - ${brand}`,
          date: formatDateLocal(pubDate),
          fee: 0,
          role: "admin",
          assignee: ADMIN_ID
        });
      }

      renderPreview();
    }

    function renderPreview() {
      const container = document.getElementById("generated-tasks");
      container.innerHTML = calculatedTasks.map((t, idx) => `
        <div class="task-item">
          <strong>${t.title}</strong><br>
          <small>📅 تاریخ: ${t.date}</small><br>
          ${t.fee > 0 ? `
            <label>دستمزد (تومان):</label>
            <input type="number" value="${t.fee}" onchange="calculatedTasks[${idx}].fee = Math.max(0, parseInt(this.value, 10) || 0)">
          ` : ''}
        </div>
      `).join("");
      document.getElementById("preview-section").classList.remove("hidden");
    }

    async function submitProject() {
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.innerText = "در حال ارسال...";

      const payload = {
        action: "create_monthly_project",
        brand: document.getElementById("brand_name").value.trim(),
        admin_id: currentUser.id,
        tasks: calculatedTasks
      };

      try {
        const res = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'X-Telegram-Init-Data': tg.initData || ''
          },
          body: JSON.stringify({ message: { from: { id: currentUser.id }, web_app_data: { data: JSON.stringify(payload) } } })
        });

        if (res.ok) {
          tg.close();
        } else {
          tg.sendData(JSON.stringify(payload));
          tg.close();
        }
      } catch (e) {
        try {
          tg.sendData(JSON.stringify(payload));
          tg.close();
        } catch (err) {
          alert("خطا در ارسال داده‌ها به ربات. لطفاً مجدداً تلاش کنید.");
          btn.disabled = false;
          btn.innerText = "🚀 ثبت نهایی و ارسال به ربات";
        }
      }
    }
  </script>
</body>
</html>
